[theme]
base = "light"
primaryColor = "#16A34A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
borderColor = "#E2E8F0"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true

[client]
showErrorDetails = true
toolbarMode = "minimal"
